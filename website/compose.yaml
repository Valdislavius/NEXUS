name: nexus-website
services:
  website:
    image: nexus-website:1.0
    build:
      context: .
      args:
        SITE_URL: ${SITE_URL:-}
    ports:
      - "127.0.0.1:${NEXUS_PORT:-3000}:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
