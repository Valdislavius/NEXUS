[package]
name = "nexus-desktop"
version = "1.0.0-beta.1"
description = "Local hardware monitoring"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
# Benchmarks run in isolated worker threads; join converts a worker panic into
# a failed result. Aborting here would bypass that boundary in release builds.
panic = "unwind"
