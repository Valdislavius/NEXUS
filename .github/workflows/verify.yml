name: Verify Desktop and website
on:
  push:
    branches: [main, 'feature/**', 'codex/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: collector/go.mod
          cache-dependency-path: collector/go.sum
      - name: Install UI dependencies
        run: npm ci --no-audit --no-fund
      - name: Test and build frontend
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test and build Collector
        run: |
          go -C collector test ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go -C collector vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/build-collector.ps1
      - name: Test native services
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Build native application
        run: cargo build --manifest-path src-tauri/Cargo.toml --locked --release --features tauri/custom-protocol
  website:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
